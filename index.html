<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS:GO 1v1 Tactical Arena</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #12131C; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        #game-container { position: relative; width: 1000px; height: 600px; box-shadow: 0 0 30px rgba(0,0,0,0.8); border: 2px solid #2A2D3D; border-radius: 8px; overflow: hidden; }
        canvas { display: block; background: #1A1C28; }
        
        /* CS:GO HUD Layout */
        .hud { position: absolute; width: 100%; height: 100%; pointer-events: none; }
        .top-bar { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; background: rgba(18, 19, 28, 0.85); border: 1px solid #33374A; border-radius: 6px; padding: 6px 20px; gap: 20px; }
        .score-box { font-size: 24px; font-weight: bold; width: 30px; text-align: center; }
        .score-t { color: #DE9B35; }
        .score-ct { color: #5D8AA8; }
        .timer { font-size: 20px; font-weight: bold; color: #E5C158; width: 60px; text-align: center; }
        
        .player-hud { position: absolute; bottom: 20px; display: flex; gap: 15px; background: rgba(18, 19, 28, 0.85); padding: 10px 18px; border-radius: 6px; border: 1px solid #33374A; }
        .p1-hud { left: 20px; border-left: 4px solid #DE9B35; }
        .p2-hud { right: 20px; border-right: 4px solid #5D8AA8; flex-direction: row-reverse; text-align: right; }
        
        .stat-val { font-size: 22px; font-weight: bold; }
        .stat-label { font-size: 10px; color: #8C93A8; text-transform: uppercase; }
        
        .kill-feed { position: absolute; top: 15px; right: 15px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
        .kill-msg { background: rgba(0, 0, 0, 0.75); padding: 4px 10px; border-radius: 4px; font-size: 13px; font-weight: 500; border-left: 3px solid #FF4655; animation: fadeOut 4s forwards; }
        
        @keyframes fadeOut { 0% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; } }
        
        .buy-menu { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(18, 19, 28, 0.95); border: 1px solid #434963; border-radius: 8px; padding: 20px; width: 400px; display: none; flex-direction: column; gap: 10px; z-index: 10; pointer-events: auto; }
